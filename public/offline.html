<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SONOCRÍTICO — Sin conexión</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b0e12;
        color: #f5f7fa;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 500;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.8125rem;
        line-height: 1.5;
        color: #7e8897;
        margin: 0 0 20px;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border-radius: 8px;
        background: rgba(143, 167, 196, 0.15);
        color: #8fa7c4;
        text-decoration: none;
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>
        Si ya abriste la biblioteca atlas con conexión, vuelve a intentar desde
        <strong>Biblioteca</strong>. Los hallazgos (imagen fija) pueden seguir disponibles offline.
      </p>
      <a id="atlas-link" href="./biblioteca/">Ir a biblioteca atlas</a>
    </main>
    <script>
      (function () {
        var base = location.pathname.replace(/\/offline\.html$/, "");
        if (base && base !== "/") {
          document.getElementById("atlas-link").href = base + "/biblioteca/";
        }
      })();
    </script>
  </body>
</html>
